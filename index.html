<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANESH SPIN — Table Tennis Performance OS</title>
<style>
/* ═══════════════════════════════════════════════════════
   TOKENS & BASE
   ═══════════════════════════════════════════════════════ */
:root{
  --bg:#08080A;--bg1:#0D0D10;--bg2:#131317;--bg3:#1A1A20;
  --line:rgba(255,255,255,0.07);--line2:rgba(255,255,255,0.14);
  --ink:#F2EFE9;--inkM:#8A8781;--inkL:#4E4B47;
  --accent:#FF4D00;--accentD:#CC3D00;--accentW:rgba(255,77,0,0.12);
  --success:#22C55E;--warn:#F59E0B;--danger:#EF4444;--info:#3B82F6;--gold:#D4AF37;
  --sans:'Segoe UI',system-ui,-apple-system,sans-serif;--mono:'SF Mono',Consolas,monospace;
  --r:8px;--rl:14px;--ease:cubic-bezier(0.16,1,0.3,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{height:100%}
body{font-family:var(--sans);font-size:14px;line-height:1.5;color:var(--ink);background:var(--bg);overflow:hidden;font-variant-numeric:tabular-nums}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
a{color:inherit;text-decoration:none}
ul{list-style:none}
::selection{background:var(--accent);color:#fff}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--inkL)}
::-webkit-scrollbar-track{background:transparent}

/* ═══════════════════════════════════════════════════════
   SPLASH
   ═══════════════════════════════════════════════════════ */
#splash{position:fixed;inset:0;background:var(--bg);z-index:9999;display:grid;place-items:center;transition:opacity .6s var(--ease),visibility .6s}
#splash.gone{opacity:0;visibility:hidden}
.splash-in{display:flex;flex-direction:column;align-items:center;gap:24px;width:260px}
.splash-ball{width:52px;height:52px;border-radius:50%;background:var(--accent);position:relative;box-shadow:0 0 40px var(--accentW)}
.splash-ball::before{content:'';position:absolute;inset:16px;background:var(--bg);border-radius:50%}
.splash-ball::after{content:'';position:absolute;inset:-6px;border:2px solid transparent;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.splash-name{font-size:15px;font-weight:600;letter-spacing:6px;color:var(--ink)}
.splash-sub{font-family:var(--mono);font-size:9px;letter-spacing:3px;color:var(--inkL);margin-top:-18px}
.splash-bar{width:100%;height:2px;background:var(--bg3);border-radius:2px;overflow:hidden}
.splash-fill{height:100%;width:0%;background:var(--accent);transition:width .15s linear}
.splash-log{font-family:var(--mono);font-size:9px;color:var(--inkL);letter-spacing:1px;height:12px;text-align:center}

/* ═══════════════════════════════════════════════════════
   SHELL
   ═══════════════════════════════════════════════════════ */
#shell{display:grid;grid-template-columns:240px 1fr;height:100vh;transition:grid-template-columns .3s var(--ease)}
#shell.collapsed{grid-template-columns:64px 1fr}

/* ── SIDEBAR ── */
.side{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.side-head{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.side-logo{width:26px;height:26px;border-radius:50%;background:var(--accent);flex-shrink:0;position:relative;box-shadow:0 0 16px var(--accentW)}
.side-logo::after{content:'';position:absolute;inset:8px;background:var(--bg);border-radius:50%}
.side-name{font-size:12px;font-weight:600;letter-spacing:3px;white-space:nowrap;transition:opacity .2s}
.side-tag{font-family:var(--mono);font-size:8px;letter-spacing:2px;color:var(--inkL);white-space:nowrap;margin-top:-2px;transition:opacity .2s}
#shell.collapsed .side-name,#shell.collapsed .side-tag{opacity:0;pointer-events:none}
.side-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 8px;display:flex;flex-direction:column;gap:1px}
.nav-sec{margin:10px 8px 4px;font-size:8px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--inkL);white-space:nowrap;overflow:hidden;transition:opacity .2s}
#shell.collapsed .nav-sec{opacity:0;height:0;margin:0}
.nav-it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:12px;font-weight:500;color:var(--inkM);cursor:pointer;transition:all .15s;white-space:nowrap;overflow:hidden;position:relative;border:1px solid transparent}
.nav-it:hover{background:var(--bg2);color:var(--ink)}
.nav-it.on{background:var(--bg3);color:var(--ink)}
.nav-it.on::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:2px;background:var(--accent);border-radius:2px}
.nav-ico{width:16px;height:16px;flex-shrink:0;display:grid;place-items:center}
.nav-ico svg{width:15px;height:15px}
.nav-lbl{flex:1;overflow:hidden;text-overflow:ellipsis;transition:opacity .2s}
.nav-bdg{font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:10px;background:var(--accentW);color:var(--accent);flex-shrink:0;transition:opacity .2s}
#shell.collapsed .nav-lbl,#shell.collapsed .nav-bdg{opacity:0}
.side-foot{padding:10px;border-top:1px solid var(--line);flex-shrink:0}
.user-chip{display:flex;align-items:center;gap:10px;padding:6px;border-radius:6px;cursor:pointer;transition:background .15s}
.user-chip:hover{background:var(--bg2)}
.user-av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accentD));display:grid;place-items:center;font-family:var(--mono);font-size:9px;font-weight:600;color:#fff;flex-shrink:0}
.user-meta{flex:1;overflow:hidden;transition:opacity .2s}
#shell.collapsed .user-meta{opacity:0}
.user-n{font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-r{font-size:9px;color:var(--inkL);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── MAIN ── */
.main{display:grid;grid-template-rows:56px 1fr 26px;overflow:hidden;background:var(--bg)}
.top{display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--bg);border-bottom:1px solid var(--line);flex-shrink:0}
.top-btn{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--inkM);font-size:13px;position:relative;transition:all .15s;flex-shrink:0}
.top-btn:hover{background:var(--bg2);color:var(--ink)}
.top-crumb{flex:1;font-size:12px;color:var(--inkM);overflow:hidden;white-space:nowrap}
.top-crumb b{color:var(--ink);font-weight:500}
.top-search{width:240px;height:28px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px;cursor:pointer;flex-shrink:0;transition:border-color .15s}
.top-search:hover{border-color:var(--line2)}
.top-search span{font-size:11px;color:var(--inkL);flex:1;text-align:left}
.top-search kbd{font-family:var(--mono);font-size:9px;padding:1px 4px;background:var(--bg3);border:1px solid var(--line);border-radius:3px;color:var(--inkL)}
@media(max-width:1000px){.top-search{display:none}}
.top-actions{display:flex;gap:2px;flex-shrink:0}
.ndot{position:absolute;top:6px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accentW)}

#view{overflow-y:auto;padding:28px 32px;scroll-behavior:smooth}
@media(max-width:768px){#view{padding:20px 16px}}

.status{display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--bg);border-top:1px solid var(--line);font-family:var(--mono);font-size:9px;color:var(--inkL);letter-spacing:1px;flex-shrink:0}
.status-l,.status-r{display:flex;align-items:center;gap:6px}
.sdot{width:4px;height:4px;border-radius:50%;background:var(--success);box-shadow:0 0 6px var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ═══════════════════════════════════════════════════════
   COMMON
   ═══════════════════════════════════════════════════════ */
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.page-head-l{flex:1;min-width:200px}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.h1{font-size:28px;font-weight:600;letter-spacing:-.02em;color:var(--ink);line-height:1.15;margin-bottom:6px}
.h2{font-size:20px;font-weight:600;letter-spacing:-.01em;margin-bottom:16px}
.sub{font-size:13px;color:var(--inkM);max-width:560px}
.head-acts{display:flex;gap:8px;flex-wrap:wrap}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 14px;border-radius:6px;font-size:12px;font-weight:500;border:1px solid transparent;transition:all .15s var(--ease);white-space:nowrap;user-select:none}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-p:hover{background:#FF6B2C;box-shadow:0 4px 16px -4px var(--accentW)}
.btn-s{background:var(--bg3);color:var(--ink);border-color:var(--line)}
.btn-s:hover{background:var(--bg2);border-color:var(--line2)}
.btn-g{background:transparent;color:var(--inkM)}
.btn-g:hover{background:var(--bg2);color:var(--ink)}
.btn-d{background:var(--danger);color:#fff}
.btn-sm{padding:4px 9px;font-size:11px}
.btn-full{width:100%}

.card{background:var(--bg1);border:1px solid var(--line);border-radius:var(--rl);padding:18px;transition:border-color .15s}
.card:hover{border-color:var(--line2)}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.card-t{font-size:13px;font-weight:600;color:var(--ink);margin-bottom:2px}
.card-s{font-size:11px;color:var(--inkL)}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:2fr 1fr}
.g32{grid-template-columns:3fr 2fr}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.g2,.g3,.g4,.g23,.g32{grid-template-columns:1fr}}

.stat{display:flex;flex-direction:column;gap:4px}
.stat-l{font-size:10px;font-weight:500;letter-spacing:1px;text-transform:uppercase;color:var(--inkL)}
.stat-v{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.02em;color:var(--ink);line-height:1}
.stat-u{font-size:11px;color:var(--inkM);margin-left:3px;letter-spacing:0}
.stat-d{font-size:11px;font-weight:500;font-family:var(--mono)}
.stat-d.up{color:var(--success)}
.stat-d.dn{color:var(--danger)}
.stat-d.flat{color:var(--inkL)}

.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.badge-a{background:var(--accentW);color:var(--accent)}
.badge-s{background:rgba(34,197,94,.12);color:var(--success)}
.badge-w{background:rgba(245,158,11,.12);color:var(--warn)}
.badge-d{background:rgba(239,68,68,.12);color:var(--danger)}
.badge-g{background:rgba(212,175,55,.12);color:var(--gold)}
.badge-n{background:var(--bg3);color:var(--inkM)}

.chip{padding:6px 13px;border-radius:6px;background:var(--bg1);border:1px solid var(--line);font-size:12px;font-weight:500;color:var(--inkM);cursor:pointer;transition:all .15s}
.chip:hover{color:var(--ink);border-color:var(--line2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}

.progress{height:4px;background:var(--bg2);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .5s var(--ease)}
.progress-fill.ok{background:var(--success)}
.progress-fill.wrn{background:var(--warn)}

.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:6px;transition:background .15s}
.row:hover{background:var(--bg2)}
.row-flex{flex:1;min-width:0}
.row-t{font-size:12px;color:var(--ink);font-weight:500;margin-bottom:1px}
.row-s{font-size:10px;color:var(--inkL)}

.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field-l{display:block;font-size:10px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--inkM);margin-bottom:6px}
.input{width:100%;height:32px;padding:0 10px;border-radius:6px;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--ink);transition:border-color .15s}
.input:focus{border-color:var(--accent);background:var(--bg1)}
.input::placeholder{color:var(--inkL)}
textarea.input{height:auto;padding:8px 10px;min-height:80px;resize:vertical;line-height:1.5}
select.input{cursor:pointer;appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10'><path d='M2 4 L5 7 L8 4' stroke='%238A8781' stroke-width='1.5' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px}

.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accentD));display:grid;place-items:center;color:#fff;font-family:var(--mono);font-size:10px;font-weight:600;flex-shrink:0}
.av-l{width:48px;height:48px;font-size:14px}

/* ═══════════════════════════════════════════════════════
   CINEMATIC POSTER & GLASS UI
   ═══════════════════════════════════════════════════════ */
.poster-hero {position:relative;border-radius:var(--rl);overflow:hidden;border:1px solid var(--line2);margin-bottom:24px;box-shadow:0 20px 60px rgba(0,0,0,0.6);background:#000}
.poster-hero img {width:100%;height:auto;display:block;object-fit:cover;min-height:400px;max-height:75vh;opacity:0.9;transition:transform 0.5s var(--ease)}
.poster-hero:hover img {transform:scale(1.02)}
.poster-overlay {position:absolute;inset:0;background:linear-gradient(to right, rgba(8,8,10,0.95) 0%, rgba(8,8,10,0.4) 60%, rgba(8,8,10,0) 100%),linear-gradient(to top, rgba(8,8,10,1) 0%, rgba(8,8,10,0) 40%);display:flex;flex-direction:column;justify-content:flex-end;padding:40px;pointer-events:none}
.poster-content {pointer-events:auto;max-width:500px;animation:slideUp 0.8s var(--ease) forwards}
@keyframes slideUp {to {transform:translateY(0);opacity:1}}
.poster-tagline {font-size:11px;font-weight:700;letter-spacing:4px;color:var(--accent);margin-bottom:12px;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.poster-tagline::before {content:'';width:24px;height:2px;background:var(--accent)}
.poster-title {font-size:48px;font-weight:800;line-height:1;letter-spacing:-0.02em;color:#fff;margin-bottom:16px;text-shadow:0 4px 20px rgba(0,0,0,0.8)}
.poster-title span {color:var(--accent);display:block;font-size:18px;letter-spacing:2px;font-weight:600;margin-top:8px;text-shadow:none}
.poster-desc {font-size:14px;color:rgba(255,255,255,0.7);line-height:1.6;margin-bottom:24px}
.poster-actions {display:flex;gap:12px}

.glass-card {background:rgba(20,20,25,0.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.08);box-shadow:0 8px 32px rgba(0,0,0,0.3);transition:all 0.3s var(--ease)}
.glass-card:hover {background:rgba(30,30,35,0.6);border-color:rgba(255,255,255,0.15);transform:translateY(-2px)}

.live-pulse {display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:1px}
.live-dot {width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse-ring 1.5s infinite}
@keyframes pulse-ring {0% {box-shadow:0 0 0 0 rgba(255,77,0,0.4)}70% {box-shadow:0 0 0 6px rgba(255,77,0,0)}100% {box-shadow:0 0 0 0 rgba(255,77,0,0)}}

/* ═══════════════════════════════════════════════════════
   GAME ARENA
   ═══════════════════════════════════════════════════════ */
.game-stage{position:relative;background:#000;border-radius:var(--rl);overflow:hidden;aspect-ratio:16/9;border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,0.6)}
#gameCanvas{width:100%;height:100%;display:block;cursor:none;touch-action:none}
.game-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);z-index:5;transition:opacity .3s}
.game-overlay.hidden{opacity:0;pointer-events:none}
.game-title{font-size:48px;font-weight:800;letter-spacing:-.03em;color:#fff;line-height:1;text-align:center}
.game-title span{color:var(--accent)}
.game-sub{font-size:14px;color:#aaa;max-width:400px;text-align:center;line-height:1.6}
.game-hud{position:absolute;top:16px;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:0 20px;pointer-events:none;z-index:2}
.game-score{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border-radius:8px;padding:8px 16px;border:1px solid rgba(255,255,255,.15)}
.game-score-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#aaa;font-weight:600}
.game-score-val{font-family:var(--mono);font-size:28px;font-weight:700;color:#fff;line-height:1}
.game-score-val.you{color:var(--accent)}
.game-score-val.ai{color:var(--info)}
.game-stats{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:16px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border-radius:6px;padding:6px 14px;border:1px solid rgba(255,255,255,.15);z-index:2;pointer-events:none}
.game-stat{font-family:var(--mono);font-size:10px;color:#aaa;letter-spacing:.5px}
.game-stat b{color:var(--accent)}
.game-msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;font-weight:800;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.8);pointer-events:none;z-index:3;opacity:0;transition:opacity .3s;text-align:center}
.game-controls{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.game-help{background:var(--bg1);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:14px;font-size:12px;color:var(--inkM);line-height:1.7}
.game-help kbd{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 6px;background:var(--bg3);border:1px solid var(--line2);border-radius:4px;color:var(--ink);margin:0 2px;font-weight:500}

/* ═══════════════════════════════════════════════════════
   REACTION TEST
   ═══════════════════════════════════════════════════════ */
.reaction-box{width:100%;aspect-ratio:16/9;border-radius:var(--rl);background:var(--bg1);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s var(--ease);position:relative;overflow:hidden}
.reaction-box.waiting{background:#7f1d1d;border-color:#ef4444}
.reaction-box.ready{background:#14532d;border-color:#22c55e}
.reaction-box.result{background:var(--bg2);border-color:var(--line2)}
.reaction-text{font-size:24px;font-weight:700;color:#fff;text-align:center;pointer-events:none;z-index:2}
.reaction-sub{position:absolute;bottom:20px;font-size:12px;color:rgba(255,255,255,0.6);z-index:2}

/* MODALS & TOAST */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);z-index:5000;display:grid;place-items:center;padding:20px;opacity:0;visibility:hidden;transition:all .25s}
.modal-bg.on{opacity:1;visibility:visible}
.modal{background:var(--bg1);border:1px solid var(--line2);border-radius:var(--rl);width:100%;max-width:520px;max-height:85vh;overflow:auto;padding:24px;position:relative;transform:scale(.96);transition:transform .3s var(--ease);box-shadow:0 24px 64px rgba(0,0,0,.7)}
.modal-bg.on .modal{transform:scale(1)}
.modal-close{position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--inkM);font-size:11px;transition:all .15s}
.modal-close:hover{background:var(--bg3);color:var(--ink)}
.modal-title{font-size:16px;font-weight:600;color:var(--ink);margin-bottom:4px}
.modal-sub{font-size:12px;color:var(--inkM);margin-bottom:18px}

/* ═══════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════ */
const $ = (s,c=document)=>c.querySelector(s);
const $$ = (s,c=document)=>Array.from(c.querySelectorAll(s));
function el(tag, attrs={}, ...kids){
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='class') n.className = v;
    else if(k==='style' && typeof v==='object') Object.assign(n.style,v);
    else if(k==='html') n.innerHTML = v;
    else if(k.startsWith('on') && typeof v==='function') n.addEventListener(k.slice(2).toLowerCase(),v);
    else if(v!=null && v!==false) n.setAttribute(k,v);
  }
  for(const kid of kids.flat()){
    if(kid==null||kid===false) continue;
    n.appendChild(typeof kid==='string'?document.createTextNode(kid):kid);
  }
  return n;
}
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); return n; }
function mount(p,...c){ clear(p); for(const x of c.flat()) if(x!=null) p.appendChild(typeof x==='string'?document.createTextNode(x):x); return p; }

const fmtN = (n,d=0)=> n==null||isNaN(n)?'—':Number(n).toLocaleString('en',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtP = (n,d=1)=> Number(n).toFixed(d)+'%';
const fmtD = (s)=>{ const d=new Date(s); return isNaN(d)?s:d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); };
const initials = (n='')=> n.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase()||'—';
const rnd = (a=0,b=1)=> a+Math.random()*(b-a);

function toast(msg, kind='', dur=2800){
  const stack = $('#toastStack');
  const t = el('div',{class:'toast '+kind},
    el('span',{class:'toast-dot'}),
    el('span',{},msg)
  );
  stack.appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(),300); },dur);
}

const Modal = {
  open({title,sub,content,actions,size}){
    const bg = $('#modalBg');
    const modal = bg.querySelector('.modal');
    if(size) modal.style.maxWidth = size;
    mount($('#modalBody'),
      title ? el('div',{class:'modal-title'},title) : null,
      sub ? el('div',{class:'modal-sub'},sub) : null,
      ...(Array.isArray(content)?content:[content]),
      actions ? el('div',{class:'modal-acts'},
        ...actions.map(a=>el('button',{
          class:'btn '+(a.class||'btn-s'),
          onclick:()=>{ a.onClick?.(); if(a.close!==false) Modal.close(); }
        },a.label))
      ) : null
    );
    bg.classList.add('on');
  },
  close(){ $('#modalBg').classList.remove('on'); }
};
$('#modalClose').onclick = () => Modal.close();
$('#modalBg').onclick = (e) => { if(e.target.id==='modalBg') Modal.close(); };

}

const Store = (() => {
  let state = load();
  const listeners = new Set();
  function load(){
    try {
      const raw = localStorage.getItem(KEY);
      if(!raw) return structuredClone(DEFAULT_STATE);
      return deepMerge(structuredClone(DEFAULT_STATE), JSON.parse(raw));
    } catch { return structuredClone(DEFAULT_STATE); }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch{} }
  function deepMerge(t,s){
    if(!s||typeof s!=='object') return t;
    for(const k in s){
      if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])) t[k]=deepMerge(t[k]||{},s[k]);
      else t[k]=s[k];
    }
    return t;
  }
  function getPath(o,p){ return p.split('.').reduce((a,k)=>a&&a[k]!==undefined?a[k]:undefined,o); }
  function setPath(o,p,v){
    const ks = p.split('.'); const last = ks.pop();
    const t = ks.reduce((a,k)=>{ if(!a[k]||typeof a[k]!=='object') a[k]={}; return a[k]; },o);
    t[last]=v;
  }
  function notify(p){ save(); listeners.forEach(f=>{try{f(state,p)}catch(e){console.warn(e)}}); }
  return {
    get:(p)=> p ? getPath(state,p) : state,
    set:(p,v)=>{ setPath(state,p,v); notify(p); },
    update:(p,fn)=>{ setPath(state,p,fn(getPath(state,p))); notify(p); },
    push:(p,item)=>{ const a=getPath(state,p); if(Array.isArray(a)){ a.push(item); notify(p);} },
    remove:(p,pred)=>{ const a=getPath(state,p); if(Array.isArray(a)){ setPath(state,p,a.filter((x,i)=>typeof pred==='function'?!pred(x,i):i!==pred)); notify(p);} },
    reset:()=>{ state=structuredClone(DEFAULT_STATE); save(); notify('*'); }
  };
})();

/* ═══════════════════════════════════════════════════════
   CHARTS
   ═══════════════════════════════════════════════════════ */
const DPR = window.devicePixelRatio || 1;
const Charts = {
  setup(canvas,h){
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width*DPR;
    canvas.height = (h||rect.height)*DPR;
    canvas.style.height = (h||rect.height)+'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(DPR,DPR);
    return {ctx,w:rect.width,h:h||rect.height};
  },
  css(v,f){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim()||f; },
  line(canvas,opts){
    const {data=[],labels=[],height=200,color='#FF4D00',fill=true,grid=true} = opts;
    const {ctx,w,h} = this.setup(canvas,height);
    const pad = {t:12,r:12,b:24,l:32};
    const cw = w-pad.l-pad.r, ch = h-pad.t-pad.b;
    const mn = Math.min(...data,0), mx = Math.max(...data,1)*1.1, rng = mx-mn||1;
    const px = i => pad.l+(i/(data.length-1||1))*cw;
    const py = v => pad.t+ch-((v-mn)/rng)*ch;
    let progress = 0; const start = performance.now();
    function draw(){
      ctx.clearRect(0,0,w,h);
      if(grid){
        ctx.strokeStyle = this.css('--line','rgba(255,255,255,.06)');
        ctx.lineWidth = 1;
        for(let i=0;i<=4;i++){ const y = pad.t+(i/4)*ch; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke(); }
      }
      ctx.fillStyle = this.css('--inkL','#4E4B47');
      ctx.font = '10px monospace'; ctx.textAlign = 'right';
      for(let i=0;i<=4;i++){ const v = mn+(rng*(4-i)/4); const y = pad.t+(i/4)*ch; ctx.fillText(Math.round(v), pad.l-5, y+3); }
      if(labels.length){ ctx.textAlign = 'center'; labels.forEach((lbl,i)=>{ ctx.fillText(lbl, px(i), h-6); }); }
      if(fill){
        const gr = ctx.createLinearGradient(0,pad.t,0,pad.t+ch);
        gr.addColorStop(0,color+'55'); gr.addColorStop(1,color+'00');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.moveTo(px(0), pad.t+ch);
        const total = Math.max(1, Math.ceil(data.length*progress));
        for(let i=0;i<total;i++) ctx.lineTo(px(i),py(data[i]));
        ctx.lineTo(px(total-1), pad.t+ch); ctx.closePath(); ctx.fill();
      }
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.beginPath();
      const total = Math.max(1, Math.ceil(data.length*progress));
      for(let i=0;i<total;i++){
        if(i===0) ctx.moveTo(px(i),py(data[i]));
        else { const cx=(px(i-1)+px(i))/2; ctx.bezierCurveTo(cx,py(data[i-1]),cx,py(data[i]),px(i),py(data[i])); }
      }
      ctx.stroke();
      ctx.fillStyle = color;
      for(let i=0;i<total;i++){ ctx.beginPath(); ctx.arc(px(i),py(data[i]),2.5,0,Math.PI*2); ctx.fill(); }
      if(progress<1){ progress = Math.min(1,(performance.now()-start)/700); requestAnimationFrame(draw.bind(this)); }
    }
    draw.call(this);
  },
  donut(canvas,opts){
    const {data=[],colors=['#FF4D00','#3B82F6','#D4AF37','#22C55E'],height=200,center='',sub=''} = opts;
    const {ctx,w,h} = this.setup(canvas,height);
    const cx = w/2, cy = h/2, r = Math.min(w,h)/2-18, ir = r*0.62;
    const total = data.reduce((a,b)=>a+b,0)||1;
    let progress = 0; const start = performance.now();
    function draw(){
      ctx.clearRect(0,0,w,h);
      let angle = -Math.PI/2;
      data.forEach((v,i)=>{
        const slice = (v/total)*Math.PI*2*progress;
        ctx.beginPath(); ctx.arc(cx,cy,r,angle,angle+slice); ctx.arc(cx,cy,ir,angle+slice,angle,true); ctx.closePath();
        ctx.fillStyle = colors[i%colors.length]; ctx.fill(); angle += slice;
      });
      if(progress>=1){
        ctx.fillStyle = this.css('--ink','#F2EFE9'); ctx.font = '600 18px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(center, cx, cy-4);
        if(sub){ ctx.fillStyle = this.css('--inkL','#4E4B47'); ctx.font = '500 9px monospace'; ctx.fillText(sub, cx, cy+12); }
      }
      if(progress<1){ progress = Math.min(1,(performance.now()-start)/700); requestAnimationFrame(draw.bind(this)); }
    }
    draw.call(this);
  },
  radar(canvas,opts){
    const {values=[],labels=[],height=240,color='#FF4D00'} = opts;
    const {ctx,w,h} = this.setup(canvas,height);
    const cx=w/2, cy=h/2, r=Math.min(w,h)/2-40, n=values.length;
    let progress = 0; const start = performance.now();
    function draw(){
      ctx.clearRect(0,0,w,h);
      ctx.strokeStyle = this.css('--line','rgba(255,255,255,.06)'); ctx.lineWidth = 1;
      for(let ring=1;ring<=4;ring++){
        ctx.beginPath();
        for(let i=0;i<=n;i++){ const a = (i/n)*Math.PI*2-Math.PI/2; const x = cx+Math.cos(a)*r*(ring/4); const y = cy+Math.sin(a)*r*(ring/4); if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); }
        ctx.closePath(); ctx.stroke();
      }
      for(let i=0;i<n;i++){ const a = (i/n)*Math.PI*2-Math.PI/2; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r); ctx.stroke(); }
      ctx.beginPath();
      values.forEach((v,i)=>{ const a = (i/n)*Math.PI*2-Math.PI/2; const rr = r*(v/100)*progress; const x = cx+Math.cos(a)*rr, y = cy+Math.sin(a)*rr; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); });
      ctx.closePath(); ctx.fillStyle = color+'30'; ctx.fill(); ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = this.css('--inkM','#8A8781'); ctx.font = '9px monospace'; ctx.textAlign = 'center';
      labels.forEach((lbl,i)=>{ const a = (i/n)*Math.PI*2-Math.PI/2; const x = cx+Math.cos(a)*(r+16); const y = cy+Math.sin(a)*(r+16)+3; ctx.fillText(lbl,x,y); });
      if(progress<1){ progress = Math.min(1,(performance.now()-start)/700); requestAnimationFrame(draw.bind(this)); }
    }
    draw.call(this);
  }
};

const NAV = [

const Router = (() => {
  const routes = {};
  let current = null;
  function register(path, render, meta={}){ routes[path] = {render, meta}; }
  function buildNav(){
    const nav = $('#sideNav'); clear(nav);
    NAV.forEach(item => {
      if(item.section){ nav.appendChild(el('div',{class:'nav-sec'},item.section)); }
      else {
        nav.appendChild(el('button',{ class:'nav-it', 'data-path':item.path, onclick:()=>navigate(item.path) },
          el('span',{class:'nav-ico',html:ICONS[item.icon]||''}),
          el('span',{class:'nav-lbl'},item.label),
          item.badge ? el('span',{class:'nav-bdg'},item.badge) : null
        ));
      }
    });
  }
  function navigate(path){
    if(!routes[path]) path = 'dashboard';
    current = path;
    $$('.nav-it').forEach(n => n.classList.toggle('on', n.dataset.path === path));
    const meta = routes[path].meta || {};
    mount($('#crumb'), el('b',{},meta.title||'Dashboard'));
    const view = $('#view');
    view.style.opacity = '0';
    view.style.transform = 'translateY(6px)';
    setTimeout(()=>{
      clear(view);
      const result = routes[path].render();
      if(Array.isArray(result)) result.forEach(c=>c&&view.appendChild(c));
      else if(result) view.appendChild(result);
      view.style.transition = 'opacity .25s cubic-bezier(0.16,1,0.3,1), transform .25s cubic-bezier(0.16,1,0.3,1)';
      requestAnimationFrame(()=>{ view.style.opacity = '1'; view.style.transform = 'translateY(0)'; });
      view.scrollTop = 0;
    }, 100);
  }
  return { register, navigate, buildNav };
})();

    el('div',{style:{marginTop:'6px'}},el('strong',{},'Goal: '),'Score 11 points before the AI. The AI adapts to your playstyle.')
  ));
  setTimeout(()=>initGame(), 100);

  function initGame(){
    const canvas = document.getElementById('gameCanvas');
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    let W, H, running = false, paused = false, gameOver = false;
    let playerScore = 0, aiScore = 0, rally = 0, bestRally = 0, speed = 1;
    let difficulty = 'normal';
    let keys = {};
    const paddle = {x:0, y:0, w:12, h:80, baseH:80};
    const ai = {x:0, y:0, w:12, h:80, baseH:80};
    const ball = {x:0, y:0, vx:0, vy:0, r:8, baseSpeed:6};
    let particles = [];

    function resize(){
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * DPR;
      canvas.height = rect.height * DPR;
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(DPR, DPR);
      W = rect.width; H = rect.height;
      paddle.x = 20; paddle.y = H/2 - paddle.h/2;
      ai.x = W - 20 - ai.w; ai.y = H/2 - ai.h/2;
    }
    window.addEventListener('resize', resize);
    resize();

    function resetBall(dir){
      ball.x = W/2; ball.y = H/2;
      const angle = (Math.random()*Math.PI/3) - Math.PI/6;
      const spd = ball.baseSpeed * speed;
      ball.vx = Math.cos(angle) * spd * (dir||(Math.random()>0.5?1:-1));
      ball.vy = Math.sin(angle) * spd;
      rally = 0;
    }

    function resetGame(){
      playerScore = 0; aiScore = 0; bestRally = 0; speed = 1; gameOver = false;
      updateHUD(); resetBall();
    }

    function updateHUD(){
      const sY = document.getElementById('scoreYou');
      const sA = document.getElementById('scoreAi');
      const sSp = document.getElementById('statSpeed');
      const sR = document.getElementById('statRally');
      const sB = document.getElementById('statBest');
      if(sY) sY.textContent = playerScore;
      if(sA) sA.textContent = aiScore;
      if(sSp) sSp.textContent = speed.toFixed(1)+'x';
      if(sR) sR.textContent = rally;
      if(sB) sB.textContent = bestRally;
    }

    function showMsg(txt, dur=1200){
      const msg = document.getElementById('gameMsg');
      if(!msg) return;
      msg.textContent = txt; msg.style.opacity = '1';
      setTimeout(()=>{ msg.style.opacity = '0'; }, dur);
    }

    function score(who){
      if(who==='player'){ playerScore++; showMsg('POINT · YOU'); }
      else { aiScore++; showMsg('POINT · AI'); }
      if(rally > bestRally) bestRally = rally;
      speed = Math.min(2.5, 1 + (playerScore+aiScore)*0.04);
      ball.r = 8 + (playerScore+aiScore)*0.15;
      updateHUD();
      if(playerScore >= 11 || aiScore >= 11){
        gameOver = true; running = false;
        const win = playerScore >= 11;
        Store.update('gameStats', s => ({ highScore: Math.max(s.highScore, bestRally), wins: s.wins + (win?1:0), losses: s.losses + (win?0:1) }));
        const overlay = document.getElementById('gameOverlay');
        if(overlay){
          overlay.classList.remove('hidden'); clear(overlay);
          overlay.appendChild(el('div',{class:'game-title'},win?el('span',{},'VICTORY'):'DEFEAT'));
          overlay.appendChild(el('div',{class:'game-sub'},win?`You won ${playerScore}-${aiScore}. Best rally: ${bestRally}`:`AI won ${aiScore}-${playerScore}. Try again!`));
          overlay.appendChild(el('button',{class:'btn btn-p',onclick:()=>{ resetGame(); overlay.classList.add('hidden'); running=true; paused=false; loop(); }},'▶ Play Again'));
        }
      } else { resetBall(who==='player'?-1:1); }
    }

    function loop(){
      if(!running || paused || gameOver) return;
      ctx.clearRect(0,0,W,H);
      const grad = ctx.createLinearGradient(0,0,0,H);
      grad.addColorStop(0,'#0A2E24'); grad.addColorStop(1,'#051510');
      ctx.fillStyle = grad; ctx.fillRect(0,0,W,H);
      ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1;
      for(let x=0;x<W;x+=40){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
      for(let y=0;y<H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
      ctx.setLineDash([8,8]); ctx.strokeStyle = 'rgba(255,255,255,0.15)';
      ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);

      const pGrad = ctx.createLinearGradient(paddle.x,0,paddle.x+paddle.w,0);
      pGrad.addColorStop(0,'#FF4D00'); pGrad.addColorStop(1,'#CC3D00');
      ctx.fillStyle = pGrad; ctx.shadowColor = '#FF4D00'; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6); ctx.fill(); ctx.shadowBlur = 0;

      const aGrad = ctx.createLinearGradient(ai.x,0,ai.x+ai.w,0);
      aGrad.addColorStop(0,'#3B82F6'); aGrad.addColorStop(1,'#2563EB');
      ctx.fillStyle = aGrad; ctx.shadowColor = '#3B82F6'; ctx.shadowBlur = 20;
      ctx.beginPath(); ctx.roundRect(ai.x, ai.y, ai.w, ai.h, 6); ctx.fill(); ctx.shadowBlur = 0;

      ctx.shadowColor = '#FFFFFF'; ctx.shadowBlur = 24; ctx.fillStyle = '#FFFFFF';
      ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;

      particles = particles.filter(p=>{ p.x += p.vx; p.y += p.vy; p.life -= 0.03; if(p.life <= 0) return false; ctx.fillStyle = `rgba(255,77,0,${p.life})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); return true; });

      ball.x += ball.vx; ball.y += ball.vy;
      if(ball.y - ball.r < 0){ ball.y = ball.r; ball.vy = -ball.vy; }
      if(ball.y + ball.r > H){ ball.y = H - ball.r; ball.vy = -ball.vy; }

      if(ball.x - ball.r < paddle.x + paddle.w && ball.x > paddle.x && ball.y > paddle.y && ball.y < paddle.y + paddle.h){
        if(ball.vx < 0){
          ball.x = paddle.x + paddle.w + ball.r;
          const rel = (ball.y - (paddle.y + paddle.h/2)) / (paddle.h/2);
          const angle = rel * Math.PI/3;
          const spd = Math.hypot(ball.vx, ball.vy) * 1.05;
          ball.vx = Math.cos(angle) * spd; ball.vy = Math.sin(angle) * spd;
          rally++; updateHUD();
          for(let i=0;i<8;i++){ particles.push({x:ball.x,y:ball.y,vx:rnd(-3,-1),vy:rnd(-2,2),r:rnd(1,3),life:1}); }
        }
      }

      if(ball.x + ball.r > ai.x && ball.x < ai.x + ai.w && ball.y > ai.y && ball.y < ai.y + ai.h){
        if(ball.vx > 0){
          ball.x = ai.x - ball.r;
          const rel = (ball.y - (ai.y + ai.h/2)) / (ai.h/2);
          const angle = rel * Math.PI/3;
          const spd = Math.hypot(ball.vx, ball.vy) * 1.05;
          ball.vx = -Math.cos(angle) * spd; ball.vy = Math.sin(angle) * spd;
          rally++; updateHUD();
          for(let i=0;i<8;i++){ particles.push({x:ball.x,y:ball.y,vx:rnd(1,3),vy:rnd(-2,2),r:rnd(1,3),life:1}); }
        }
      }

      if(ball.x < 0) score('ai');
      else if(ball.x > W) score('player');

      const aiSpeed = difficulty==='easy'?3:difficulty==='normal'?5:7;
      const aiTarget = ball.y - ai.h/2;
      ai.y += (aiTarget - ai.y) * (aiSpeed/60);
      ai.y = Math.max(0, Math.min(H-ai.h, ai.y));

      const keySpeed = 8;
      if(keys['ArrowUp']||keys['w']||keys['W']) paddle.y -= keySpeed;
      if(keys['ArrowDown']||keys['s']||keys['S']) paddle.y += keySpeed;
      paddle.y = Math.max(0, Math.min(H-paddle.h, paddle.y));

      requestAnimationFrame(loop);
    }

    canvas.addEventListener('mousemove',(e)=>{
      const r = canvas.getBoundingClientRect();
      const y = (e.clientY - r.top) / r.height * H;
      paddle.y = y - paddle.h/2;
      paddle.y = Math.max(0, Math.min(H-paddle.h, paddle.y));
    });
    canvas.addEventListener('touchmove',(e)=>{
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const t = e.touches[0];
      const y = (t.clientY - r.top) / r.height * H;
      paddle.y = y - paddle.h/2;
      paddle.y = Math.max(0, Math.min(H-paddle.h, paddle.y));
    },{passive:false});
    document.addEventListener('keydown',(e)=>{ keys[e.key] = true; if(e.key===' ' && running){ e.preventDefault(); paused = !paused; if(!paused) loop(); } });
    document.addEventListener('keyup',(e)=>{ keys[e.key] = false; });

    const startBtn = document.getElementById('gameStart');
    if(startBtn) startBtn.onclick = ()=>{ document.getElementById('gameOverlay').classList.add('hidden'); resetGame(); running = true; paused = false; loop(); };
    document.getElementById('gamePause').onclick = ()=>{ paused = !paused; if(!paused && running) loop(); toast(paused?'Paused':'Resumed'); };
    document.getElementById('gameReset').onclick = ()=>{ resetGame(); running = true; paused = false; document.getElementById('gameOverlay').classList.add('hidden'); loop(); };
    $$('.seg-btn[data-diff]').forEach(b=>{
      b.onclick = ()=>{ $$('.seg-btn[data-diff]').forEach(x=>x.classList.remove('on')); b.classList.add('on'); difficulty = b.dataset.diff; toast(`Difficulty: ${difficulty}`); };
    });

    if(!CanvasRenderingContext2D.prototype.roundRect){
      CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){ if(w<2*r)r=w/2; if(h<2*r)r=h/2; this.beginPath(); this.moveTo(x+r,y); this.arcTo(x+w,y,x+w,y+h,r); this.arcTo(x+w,y+h,x,y+h,r); this.arcTo(x,y+h,x,y,r); this.arcTo(x,y,x+w,y,r); this.closePath(); };
    }

    resetBall();
    ctx.clearRect(0,0,W,H);
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#0A2E24'); g.addColorStop(1,'#051510');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.setLineDash([8,8]); ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.beginPath(); ctx.moveTo(W/2,0); ctx.lineTo(W/2,H); ctx.stroke(); ctx.setLineDash([]);
  }
  return root;
},{title:'Arena'});

  let startTime = 0;

  root.appendChild(el('div',{class:'page-head'},
    el('div',{class:'page-head-l'}, el('div',{class:'eyebrow'},'Reflex Trainer'), el('h1',{class:'h1'},'Reaction Test'), el('p',{class:'sub'},'Measure your reaction time. Click when the box turns green. Faster than 250ms is elite.') ),
    el('div',{class:'head-acts'}, el('div',{class:'badge badge-g'},`Best: ${Store.get('gameStats.reactionBest') || '—'} ms`) )

  const box = el('div',{class:'reaction-box idle', id:'reactionBox'});
  const text = el('div',{class:'reaction-text', id:'reactionText'},'Click to start');
  const sub = el('div',{class:'reaction-sub', id:'reactionSub'},'Average human: ~250ms');
  box.appendChild(text); box.appendChild(sub);
  root.appendChild(box);

  box.onclick = () => {
    if(state === 'idle' || state === 'result'){
      state = 'waiting';
      box.className = 'reaction-box waiting';
      text.textContent = 'Wait for green...';
      sub.textContent = 'Don\'t click yet!';
      const delay = 1500 + Math.random() * 3000;
      timeoutId = setTimeout(() => {
        state = 'ready';
        box.className = 'reaction-box ready';
        text.textContent = 'CLICK!';
        sub.textContent = '';
        startTime = performance.now();
      }, delay);
    } else if(state === 'waiting'){
      clearTimeout(timeoutId);
      state = 'result';
      box.className = 'reaction-box result';
      text.textContent = 'Too early!';
      sub.textContent = 'Click to try again';
    } else if(state === 'ready'){
      const time = Math.round(performance.now() - startTime);
      state = 'result';
      box.className = 'reaction-box result';
      text.textContent = time + ' ms';
      sub.textContent = time < 200 ? '⚡ Elite!' : time < 250 ? '🔥 Great!' : time < 350 ? '👍 Good' : 'Try again';
      const best = Store.get('gameStats.reactionBest') || 9999;
      if(time < best){
        Store.update('gameStats', s => ({ ...s, reactionBest: time }));
        toast('New personal best!', 'ok');
        const badge = root.querySelector('.badge-g');
        if(badge) badge.textContent = `Best: ${time} ms`;
      }
    }
  };

  return root;
},{title:'Reaction Test'});

(function boot(){
  const prefs = Store.get('prefs') || {};
  if(prefs.theme) document.body.setAttribute('data-theme',prefs.theme);
  if(prefs.sidebarCollapsed) $('#shell').classList.add('collapsed');

  const logs = ['initializing kernel…','loading modules…','restoring session…','syncing state…','ready'];
  const fill = $('#splashFill');
  const log = $('#splashLog');
  let step = 0;
  function tick(){
    if(step>=logs.length){
      setTimeout(()=>{
        $('#splash').classList.add('gone');
        $('#shell').style.display = 'grid';
        Router.buildNav();
        Router.navigate('dashboard');
        initHandlers();
      },250);
      return;
    }
    log.textContent = logs[step];
    fill.style.width = ((step+1)/logs.length*100)+'%';
    step++;
    setTimeout(tick,180);
  }
  tick();

  function initHandlers(){
    const u = Store.get('user');
    $('#userName').textContent = u.name; $('#userRole').textContent = u.role; $('#userAv').textContent = u.avatar;
    $('#sideToggle').onclick = ()=>{ $('#shell').classList.toggle('collapsed'); Store.update('prefs',p=>({...p,sidebarCollapsed:$('#shell').classList.contains('collapsed')})); };
    $('#themeBtn').onclick = ()=>{ const cur = document.body.getAttribute('data-theme') || 'dark'; const next = cur==='light'?'dark':'light'; document.body.setAttribute('data-theme',next); Store.update('prefs',p=>({...p,theme:next})); toast(`Theme: ${next}`,'ok'); };

    // Command palette
    const cmdkBg = $('#cmdkBg'), cmdkIn = $('#cmdkInput'), cmdkRes = $('#cmdkResults');
    let selIdx = 0, filtered = [];
    const CMDS = [
      {sec:'Navigate', items: NAV.filter(n=>n.path).map(n=>({label:n.label,icon:n.icon,action:()=>Router.navigate(n.path)}))},
      {sec:'Create', items:[{label:'Log a match',icon:'matches',action:()=>Router.navigate('matches')},{label:'Start a drill',icon:'training',action:()=>Router.navigate('training')},{label:'Play Arena',icon:'game',action:()=>Router.navigate('game')},{label:'Reaction Test',icon:'reaction',action:()=>Router.navigate('reaction')}]},
      {sec:'System', items:[{label:'Toggle theme',icon:'settings',action:()=>$('#themeBtn').click()},{label:'Open settings',icon:'settings',action:()=>Router.navigate('settings')}]}
    ];
    function openCmdk(){ cmdkBg.classList.add('on'); cmdkIn.value = ''; selIdx = 0; renderCmdk(''); setTimeout(()=>cmdkIn.focus(),60); }
    function closeCmdk(){ cmdkBg.classList.remove('on'); }
    function renderCmdk(q){
      clear(cmdkRes); filtered = []; const query = q.toLowerCase();
      CMDS.forEach(sec=>{
        const items = sec.items.filter(it=>!query||it.label.toLowerCase().includes(query));
        if(!items.length) return;
        cmdkRes.appendChild(el('div',{class:'cmdk-sec'},sec.sec));
        items.forEach(it=>{
          const idx = filtered.length; filtered.push(it);
          cmdkRes.appendChild(el('div',{ class:'cmdk-it '+(idx===selIdx?'sel':''), onclick:()=>{ closeCmdk(); it.action(); } }, el('span',{class:'cmdk-it-ico',html:ICONS[it.icon]||'·'}), el('span',{class:'cmdk-it-lbl'},it.label) ));
        });
      });
    }
    cmdkIn.addEventListener('input',e=>{ selIdx = 0; renderCmdk(e.target.value); });
    cmdkIn.addEventListener('keydown',e=>{
      if(e.key==='ArrowDown'){ e.preventDefault(); selIdx = Math.min(filtered.length-1,selIdx+1); renderCmdk(cmdkIn.value); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); selIdx = Math.max(0,selIdx-1); renderCmdk(cmdkIn.value); }
      else if(e.key==='Enter'){ e.preventDefault(); filtered[selIdx]?.action(); closeCmdk(); }
      else if(e.key==='Escape'){ closeCmdk(); }
    });
    cmdkBg.addEventListener('click',e=>{ if(e.target===cmdkBg) closeCmdk(); });
    $('#searchOpen').onclick = openCmdk;
    document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); openCmdk(); } if(e.key==='Escape') closeCmdk(); });

    // Notifications
    const notifBtn = $('#notifBtn'), notifPanel = $('#notifPanel'), notifList = $('#notifList');
    function renderNotifs(){
      clear(notifList);
      Store.get('notifications').forEach(n=>{
        notifList.appendChild(el('div',{class:'notif-it '+(n.unread?'unread':'read')}, el('div',{class:'notif-body'}, el('div',{class:'notif-t'},n.title), el('div',{style:{fontSize:'11px',color:'var(--inkM)',marginTop:'2px'}},n.body), el('div',{class:'notif-time'},n.time)) ));
      });
    }
    renderNotifs();
    notifBtn.onclick = e=>{ e.stopPropagation(); notifPanel.classList.toggle('on'); };
    $('#notifClear').onclick = ()=>{ Store.update('notifications',arr=>arr.map(n=>({...n,unread:false}))); renderNotifs(); document.querySelector('.ndot')?.remove(); };
    document.addEventListener('click',e=>{ if(!notifPanel.contains(e.target)&&!notifBtn.contains(e.target)) notifPanel.classList.remove('on'); });

    function updateClock(){ const c = $('#clock'); if(c) c.textContent = new Date().toLocaleTimeString('en-GB'); }
    updateClock(); setInterval(updateClock,1000);
    console.log('%cDANESH SPIN%c Performance OS · v2.0','background:#FF4D00;color:#fff;padding:4px 10px;border-radius:4px;font-weight:700','color:#8A8781;font-size:12px');
  }
})();
</script>
</body>
