<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DANESH SPIN — Performance OS for Table Tennis</title>
<meta name="description" content="DANESH SPIN — an operating system for table tennis athletes. Analytics, tactics, academy, ranking, and match intelligence.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23FF4D00'/><circle cx='50' cy='50' r='18' fill='%230A0A0B'/></svg>">
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/pages.css">
</head>
<body>

<!-- ═══════════ BOOT SPLASH ═══════════ -->
<div id="boot" class="boot">
  <div class="boot-inner">
    <div class="boot-mark">
      <div class="boot-ring"></div>
      <div class="boot-core"></div>
    </div>
    <div class="boot-text">
      <span class="boot-brand">DANESH SPIN</span>
      <span class="boot-sub">PERFORMANCE OS · v2.0</span>
    </div>
    <div class="boot-bar"><div class="boot-bar-fill" id="bootBar"></div></div>
    <div class="boot-log" id="bootLog">initializing kernel…</div>
  </div>
</div>

<!-- ═══════════ APP SHELL ═══════════ -->
<div id="app" class="app hidden">

  <!-- ── SIDEBAR ── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark"><span></span></div>
      <div class="brand-text">
        <span class="brand-name">DANESH SPIN</span>
        <span class="brand-tag">PERFORMANCE OS</span>
      </div>
    </div>

    <nav class="sidebar-nav" id="sidebarNav">
      <!-- injected by router -->
    </nav>

    <div class="sidebar-foot">
      <div class="user-chip" id="userChip">
        <div class="user-avatar" id="userAvatar">—</div>
        <div class="user-meta">
          <span class="user-name" id="userName">Guest</span>
          <span class="user-role" id="userRole">Free tier</span>
        </div>
        <button class="user-menu-btn" id="userMenuBtn" aria-label="User menu">⋯</button>
      </div>
    </div>
  </aside>

  <!-- ── MAIN ── -->
  <main class="main">
    <header class="topbar">
      <button class="topbar-icon" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
      <div class="topbar-crumbs" id="crumbs">
        <span class="crumb">Dashboard</span>
      </div>
      <div class="topbar-search" id="searchOpen">
        <span class="search-icon">⌕</span>
        <span class="search-placeholder">Search or jump to…</span>
        <kbd class="search-kbd">⌘K</kbd>
      </div>
      <div class="topbar-actions">
        <button class="topbar-icon" id="langBtn" title="Language">EN</button>
        <button class="topbar-icon" id="themeBtn" title="Theme">◐</button>
        <button class="topbar-icon notif-btn" id="notifBtn" title="Notifications">
          <span>◔</span><span class="notif-dot"></span>
        </button>
        <button class="topbar-icon" id="quickBtn" title="Quick actions">＋</button>
      </div>
    </header>

    <div class="view" id="view">
      <!-- pages injected by router -->
    </div>

    <footer class="statusbar">
      <div class="statusbar-left">
        <span class="status-dot"></span>
        <span id="statusText">Systems nominal</span>
      </div>
      <div class="statusbar-right">
        <span id="statusClock">00:00:00</span>
        <span class="status-sep">·</span>
        <span id="statusRegion">EU-WEST</span>
      </div>
    </footer>
  </main>
</div>

<!-- ═══════════ COMMAND PALETTE ═══════════ -->
<div class="cmdk-backdrop" id="cmdkBackdrop">
  <div class="cmdk">
    <div class="cmdk-input-wrap">
      <span class="cmdk-icon">⌕</span>
      <input class="cmdk-input" id="cmdkInput" placeholder="Type a command or search…" autocomplete="off">
      <kbd class="cmdk-esc">ESC</kbd>
    </div>
    <div class="cmdk-results" id="cmdkResults"></div>
    <div class="cmdk-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
      <span><kbd>↵</kbd> select</span>
      <span><kbd>esc</kbd> close</span>
    </div>
  </div>
</div>

<!-- ═══════════ NOTIFICATIONS PANEL ═══════════ -->
<div class="notif-panel" id="notifPanel">
  <div class="notif-head">
    <h3>Notifications</h3>
    <button class="notif-clear" id="notifClear">Mark all read</button>
  </div>
  <div class="notif-list" id="notifList"></div>
</div>

<!-- ═══════════ QUICK ACTIONS ═══════════ -->
<div class="quick-panel" id="quickPanel">
  <div class="quick-head">Quick actions</div>
  <button class="quick-item" data-action="new-match"><span>◎</span>Log a match</button>
  <button class="quick-item" data-action="new-drill"><span>◈</span>Start a drill</button>
  <button class="quick-item" data-action="new-note"><span>▤</span>New note</button>
  <button class="quick-item" data-action="new-goal"><span>◆</span>Set a goal</button>
</div>

<!-- ═══════════ MODAL ROOT ═══════════ -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- ═══════════ TOAST STACK ═══════════ -->
<div class="toast-stack" id="toastStack"></div>

<!-- ═══════════ SCRIPTS ═══════════ -->
<script src="js/store.js"></script>
<script src="js/utils.js"></script>
<script src="js/charts.js"></script>
<script src="js/router.js"></script>
<script src="js/modules/dashboard.js"></script>
<script src="js/modules/analytics.js"></script>
<script src="js/modules/tactics.js"></script>
<script src="js/modules/academy.js"></script>
<script src="js/modules/calculator.js"></script>
<script src="js/modules/ranking.js"></script>
<script src="js/modules/matches.js"></script>
<script src="js/modules/training.js"></script>
<script src="js/modules/profile.js"></script>
<script src="js/modules/shop.js"></script>
<script src="js/modules/community.js"></script>
<script src="js/modules/settings.js"></script>
<script src="js/modules/admin.js"></script>
<script src="js/app.js"></script>
</body>
</html>
